<script>
document.querySelectorAll(".chip-filter").forEach(group => {
  const items = () => document.querySelectorAll(group.dataset.target);
  const sides = () => {
    let i = 0;
    items().forEach(el => { if (!el.hidden) el.dataset.side = i++ % 2 ? "r" : "l"; });
  };
  group.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    group.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    const kind = btn.dataset.kind;
    items().forEach(el => {
      el.hidden = kind === "key" ? el.dataset.key !== "true" : kind !== "all" && el.dataset.kind !== kind;
    });
    sides();
  });
});
</script>
<script>
// Accessibility and navigation fixes for Quarto's built-in markup.
(() => {
  const ready = fn => document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", fn) : fn();
  ready(() => {
    // The menu button is a disclosure, not a menu; name the main navigation.
    document.querySelectorAll(".navbar-toggler[role='menu']").forEach(b => b.removeAttribute("role"));
    const mainNav = document.querySelector("#quarto-header nav");
    if (mainNav && !mainNav.hasAttribute("aria-label")) mainNav.setAttribute("aria-label", "Main");

    // Listing card titles are h5 straight under a section h2; announce them as h3.
    document.querySelectorAll(".quarto-grid-item h5.card-title").forEach(h => h.setAttribute("aria-level", "3"));

    // Wide output blocks scroll sideways; make them reachable by keyboard.
    const outputs = document.querySelectorAll(".cell-output pre");
    const markScroll = pre => {
      const wide = pre.scrollWidth > pre.clientWidth + 1;
      if (wide) {
        pre.tabIndex = 0;
        pre.setAttribute("role", "region");
        // Each region needs its own name.
        pre.setAttribute("aria-label", `Code output ${[...outputs].indexOf(pre) + 1} of ${outputs.length}, scrolls sideways`);
      } else if (pre.getAttribute("role") === "region") {
        pre.removeAttribute("tabindex");
        pre.removeAttribute("role");
        pre.removeAttribute("aria-label");
      }
    };
    outputs.forEach(markScroll);
    if (outputs.length && "ResizeObserver" in window) {
      const ro = new ResizeObserver(entries => entries.forEach(e => markScroll(e.target)));
      outputs.forEach(pre => ro.observe(pre));
    }

    // Topic tags on a tutorial point at that topic on the tutorials page, not at
    // a filtered list on the home page. Quarto wraps each tag in a link once it
    // has loaded listings.json, so rewrite the link whenever it appears.
    const cats = document.querySelector("header.quarto-title-block .quarto-categories");
    if (cats) {
      const offset = document.querySelector("meta[name='quarto:offset']")?.content || "./";
      const hubs = ["Dengue", "Chikungunya", "S. intermedius", "Methods"];
      const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const target = name => offset + "tutorials/index.html" + (hubs.includes(name) ? "#" + slug(name) : "");
      const fix = () => {
        // If our fallback link was wrapped again by Quarto, keep just one link.
        cats.querySelectorAll(".quarto-category a a").forEach(inner => inner.replaceWith(...inner.childNodes));
        cats.querySelectorAll(".quarto-category a").forEach(a => {
          const want = target(a.closest(".quarto-category").textContent.trim());
          if (a.getAttribute("href") !== want) a.setAttribute("href", want);
        });
      };
      fix();
      new MutationObserver(fix).observe(cats, { childList: true, subtree: true });
      // If Quarto never adds its links (listings.json unavailable), add them.
      window.addEventListener("load", () => setTimeout(() => {
        cats.querySelectorAll(".quarto-category").forEach(tag => {
          if (tag.querySelector("a")) return;
          const a = document.createElement("a");
          a.href = target(tag.textContent.trim());
          a.append(...tag.childNodes);
          tag.append(a);
        });
      }, 2000));
    }
  });

  // Search overlay: keep Tab inside it while open, let Escape close it from
  // anywhere, and return focus to the search button when it closes.
  document.addEventListener("keydown", e => {
    const box = document.querySelector(".aa-DetachedContainer");
    if (!box) return;
    if (e.key === "Escape" && document.activeElement !== box.querySelector("input")) {
      box.querySelector(".aa-DetachedCancelButton")?.click();
      return;
    }
    if (e.key !== "Tab") return;
    const stops = [...box.querySelectorAll("input, button, a[href], [tabindex]:not([tabindex='-1'])")]
      .filter(el => !el.disabled && el.getClientRects().length && !el.matches(".aa-SubmitButton"));
    if (!stops.length) return;
    const first = stops[0], last = stops[stops.length - 1], here = document.activeElement;
    if (!box.contains(here)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && here === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && here === last) { e.preventDefault(); first.focus(); }
  }, true);
  let wasOpen = false;
  new MutationObserver(() => {
    const open = !!document.querySelector(".aa-DetachedOverlay");
    if (wasOpen && !open) {
      // Wait a tick: the overlay's own close may still be moving focus.
      setTimeout(() => {
        const btn = document.querySelector(".aa-DetachedSearchButton");
        const here = document.activeElement;
        if (btn && (!here || here === document.body || !here.isConnected)) btn.focus();
      }, 0);
    }
    wasOpen = open;
  }).observe(document.body, { childList: true });

  // Escape closes the phone menu and returns focus to the menu button.
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape" || document.querySelector(".aa-DetachedContainer")) return;
    const menu = document.querySelector("#navbarCollapse.show");
    if (!menu || !window.bootstrap) return;
    bootstrap.Collapse.getOrCreateInstance(menu).hide();
    document.querySelector(".navbar-toggler")?.focus();
  });
})();
</script>
<script>
// Home hero animation: plays muted while on screen, never starts by itself for
// people who prefer reduced motion, and can always be paused or played.
(() => {
  const fig = document.querySelector(".hero-video");
  if (!fig) return;
  const video = fig.querySelector("video");
  const btn = fig.querySelector(".hero-video-toggle");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  video.controls = false;
  btn.hidden = false;
  let stopped = reduce.matches;   // paused by the visitor, or by their motion setting
  let onScreen = false;
  const sync = () => {
    btn.classList.toggle("is-paused", video.paused);
    btn.setAttribute("aria-label", video.paused ? "Play the animation" : "Pause the animation");
  };
  const update = () => {
    if (!stopped && onScreen) {
      video.play().catch(() => { stopped = true; sync(); });
    } else {
      video.pause();
    }
  };
  btn.addEventListener("click", () => {
    stopped = !video.paused;
    if (!stopped) onScreen = true;
    update();
  });
  video.addEventListener("play", sync);
  video.addEventListener("pause", sync);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => { onScreen = entry.isIntersecting; update(); }, { threshold: 0.2 }).observe(video);
  } else {
    onScreen = true; update();
  }
  reduce.addEventListener?.("change", () => { if (reduce.matches) { stopped = true; update(); } });
  sync();
})();
</script>
